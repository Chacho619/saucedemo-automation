name: SauceDemo quality and tests
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saucedemo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -m 'unit or component' --junitxml=artifacts/quality.xml
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/*.xml
            allure-results/**
          retention-days: 7
  e2e:
    needs: quality
    # No entregar credenciales a código de un pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - browser: chromium
            viewport: 1440x900
          - browser: firefox
            viewport: 1440x900
          - browser: webkit
            viewport: 1440x900
          - browser: chromium
            viewport: 390x844
    env:
      BROWSER: ${{ matrix.browser }}
      VIEWPORT: ${{ matrix.viewport }}
      CAPTURE_EVIDENCE: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: pytest E2E and offline page contracts
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_LOCKED_USERNAME: ${{ secrets.SAUCE_LOCKED_USERNAME }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
        run: python run_tests.py pytest -m 'e2e or component' -n 2 --junitxml=artifacts/pytest.xml
      - name: Behave
        if: ${{ !cancelled() }}
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_LOCKED_USERNAME: ${{ secrets.SAUCE_LOCKED_USERNAME }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
        run: python run_tests.py behave -f allure_behave.formatter:AllureFormatter -o allure-results --junit --junit-directory artifacts/behave
      - name: Generate Allure HTML report
        if: ${{ !cancelled() }}
        run: |
          curl -L https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-commandline-2.32.0.tgz -o allure-commandline.tgz
          tar -xzf allure-commandline.tgz -C .
          ./allure-2.32.0/bin/allure generate allure-results --clean -o allure-report
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: allure-report-${{ matrix.browser }}-${{ matrix.viewport }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: allure-report/
          retention-days: 7
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ matrix.browser }}-${{ matrix.viewport }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/**/*.xml
          retention-days: 7
